<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelling Bee</title>
<style>
  :root {
    --bg: #fff8e7; --card: #ffffff; --ink: #2b2b2b; --muted: #777;
    --accent: #f5b800; --accent-ink: #3a2c00; --good: #2e9e5b; --bad: #d64545; --line: #eadfbf;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a16; --card: #26241d; --ink: #f2eee2; --muted: #a9a390; --line: #3a372b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "Nunito", system-ui, -apple-system, sans-serif;
  }
  main { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 28px 24px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; font-size: .9rem; color: var(--muted); }
  .stats b { display: block; font-size: 1.4rem; color: var(--ink); }
  .levels { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .levels button { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
    color: var(--ink); font: inherit; font-size: .85rem; cursor: pointer; }
  .levels button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .speak { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    font-size: 2.4rem; cursor: pointer; box-shadow: 0 4px 0 #c99300; transition: transform .05s; }
  .speak:active { transform: translateY(3px); box-shadow: 0 1px 0 #c99300; }
  .speak.talking { animation: pulse .8s infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  .links { margin: 12px 0 18px; display: flex; gap: 16px; justify-content: center; }
  .links button { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: .9rem; cursor: pointer; }
  input[type=text] { width: 100%; padding: 14px; font: inherit; font-size: 1.4rem; text-align: center; letter-spacing: .08em;
    border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  input.good { border-color: var(--good); } input.bad { border-color: var(--bad); }
  .go { margin-top: 12px; width: 100%; padding: 14px; border: 0; border-radius: 12px; font: inherit; font-size: 1.05rem;
    font-weight: 700; background: var(--ink); color: var(--bg); cursor: pointer; }
  .msg { min-height: 3.2em; margin-top: 14px; font-size: 1.05rem; }
  .msg.good { color: var(--good); } .msg.bad { color: var(--bad); }
  .hint { color: var(--muted); font-size: .9rem; margin-top: 6px; min-height: 1.4em; }
  .warn { color: var(--bad); font-size: .85rem; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>🐝 Spelling Bee</h1>
  <p class="sub">Listen to the word, then spell it.</p>

  <div class="stats">
    <div><b id="score">0</b>Correct</div>
    <div><b id="streak">0</b>Streak</div>
    <div><b id="best">0</b>Best</div>
  </div>

  <div class="levels" role="group" aria-label="Difficulty">
    <button data-level="easy" aria-pressed="false">Easy</button>
    <button data-level="medium" aria-pressed="true">Medium</button>
    <button data-level="hard" aria-pressed="false">Hard</button>
  </div>

  <button class="speak" id="speak" aria-label="Hear the word">🔊</button>
  <div class="links">
    <button id="slow">Slower</button>
    <button id="sentence">Use in a sentence</button>
    <button id="skip">Skip</button>
  </div>

  <form id="form" autocomplete="off">
    <input type="text" id="answer" placeholder="Type the spelling" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your spelling">
    <button class="go" type="submit" id="go">Check</button>
  </form>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="hint" id="hint"></div>
  <div class="warn" id="warn" hidden>Speech isn't supported in this browser — try Chrome, Edge or Safari.</div>
</main>

<script>
const WORDS = {
  easy: [
    ["because","I stayed inside because it was raining."],["friend","She is my best friend."],
    ["people","Many people came to the party."],["school","We walk to school every morning."],
    ["beautiful","The garden looks beautiful in spring."],["different","These two shoes are different."],
    ["favorite","Blue is my favorite color."],["together","We worked on it together."],
    ["answer","Please write your answer here."],["surprise","The party was a big surprise."],
    ["library","I borrowed a book from the library."],["animal","A fox is a wild animal."]
  ],
  medium: [
    ["necessary","It is necessary to wear a helmet."],["separate","Please keep the two piles separate."],
    ["definitely","I will definitely be there."],["environment","We should protect the environment."],
    ["restaurant","We ate dinner at a small restaurant."],["embarrass","Don't embarrass me in front of everyone."],
    ["calendar","Mark the date on the calendar."],["government","The government passed a new law."],
    ["occasion","Graduation is a special occasion."],["tomorrow","I'll finish it tomorrow."],
    ["knowledge","Reading builds knowledge."],["schedule","Check the bus schedule."]
  ],
  hard: [
    ["conscientious","She is a conscientious student."],["maintenance","The elevator is closed for maintenance."],
    ["bureaucracy","The bureaucracy slowed everything down."],["pharaoh","The pharaoh ruled ancient Egypt."],
    ["questionnaire","Please fill out the questionnaire."],["rhythm","The drummer kept a steady rhythm."],
    ["millennium","A millennium is one thousand years."],["silhouette","A silhouette appeared in the window."],
    ["onomatopoeia","'Buzz' is an example of onomatopoeia."],["mischievous","The mischievous puppy chewed my shoe."],
    ["entrepreneur","The entrepreneur launched a startup."],["camouflage","The lizard used camouflage to hide."]
  ]
};

const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

let level = "medium", queue = [], current = null, score = 0, streak = 0, best = +store.get("sb-best") || 0;
let attempts = 0, voice = null;
$("best").textContent = best;

const synth = window.speechSynthesis;
if (!synth) $("warn").hidden = false;

function pickVoice() {
  const v = synth ? synth.getVoices() : [];
  voice = v.find(x => /en[-_](US|GB)/i.test(x.lang) && /natural|enhanced|premium|samantha|google/i.test(x.name))
       || v.find(x => /^en/i.test(x.lang)) || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

function say(text, rate = 0.9) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = voice ? voice.lang : "en-US";
  u.rate = rate;
  u.onstart = () => $("speak").classList.add("talking");
  u.onend = u.onerror = () => $("speak").classList.remove("talking");
  synth.speak(u);
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function next() {
  if (!queue.length) queue = shuffle(WORDS[level].slice());
  current = queue.pop(); attempts = 0;
  const input = $("answer");
  input.value = ""; input.className = ""; input.disabled = false; input.focus();
  $("msg").textContent = ""; $("msg").className = "msg"; $("hint").textContent = "";
  $("go").textContent = "Check";
  setTimeout(() => say(current[0]), 250);
}

function setStreak(n) {
  streak = n; $("streak").textContent = n;
  if (n > best) { best = n; store.set("sb-best", best); $("best").textContent = best; }
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  // After a finished word, Enter/Check moves on.
  if ($("answer").disabled) return next();
  const guess = $("answer").value.trim().toLowerCase();
  if (!guess) return;
  const input = $("answer"), msg = $("msg");
  if (guess === current[0]) {
    input.className = "good"; msg.className = "msg good";
    msg.textContent = "✅ Correct! " + current[0];
    score++; $("score").textContent = score; setStreak(streak + 1);
    input.disabled = true; $("go").textContent = "Next word";
    say("Correct!", 1);
  } else {
    attempts++; setStreak(0);
    input.className = "bad"; msg.className = "msg bad";
    if (attempts >= 3) {
      msg.textContent = "❌ The word was “" + current[0] + "”.";
      input.disabled = true; $("go").textContent = "Next word";
    } else {
      msg.textContent = "Not quite — try again (" + (3 - attempts) + " left).";
      if (attempts === 2) $("hint").textContent = "Hint: starts with “" + current[0][0] + "” and has " + current[0].length + " letters.";
      input.select();
    }
  }
});

$("speak").onclick = () => { say(current[0]); $("answer").focus(); };
$("slow").onclick = () => { say(current[0], 0.5); $("answer").focus(); };
$("sentence").onclick = () => { say(current[1], 0.9); $("answer").focus(); };
$("skip").onclick = () => {
  $("msg").className = "msg bad"; $("msg").textContent = "Skipped — it was “" + current[0] + "”.";
  setStreak(0); $("answer").disabled = true; $("go").textContent = "Next word";
};
document.querySelectorAll(".levels button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".levels button").forEach(x => x.setAttribute("aria-pressed", x === b));
  level = b.dataset.level; queue = []; next();
});

next();
</script>
</body>
</html>
